<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <rect width="1600" height="1000" fill="#0E110F"/>
  <!-- franja diagonal naranja (corte de marca) -->
  <polygon points="760,250 1600,120 1600,250 820,380" fill="#FF5A1F"/>
  <!-- cordillera lejana -->
  <path d="M0,560 L120,470 L230,520 L380,400 L520,500 L640,430 L780,520 L900,410 L1040,500 L1180,380 L1330,470 L1460,400 L1600,460 L1600,1000 L0,1000 Z" fill="#17201A"/>
  <!-- cordillera media -->
  <path d="M0,660 L160,560 L300,640 L470,540 L620,630 L760,560 L930,650 L1080,560 L1240,640 L1400,570 L1600,640 L1600,1000 L0,1000 Z" fill="#1F2E1D"/>
  <!-- pinos en la cordillera media -->
  <g fill="#1A2718">
    <path d="M200,640 l14,-46 l14,46 Z M232,646 l11,-36 l11,36 Z M1290,650 l14,-46 l14,46 Z M1322,656 l11,-36 l11,36 Z M560,650 l12,-40 l12,40 Z"/>
  </g>
  <!-- cresta cercana con la bajada -->
  <path d="M0,820 L260,760 L520,700 L760,640 L940,600 L1050,620 L1200,700 L1380,780 L1600,840 L1600,1000 L0,1000 Z" fill="#2F4A2B"/>
