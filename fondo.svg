  <path d="M1000,612 L1120,668 L1230,724 L1360,780" fill="none" stroke="#FF5A1F" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- rider bajando -->
  <g transform="translate(950,548) rotate(17) scale(1.35)" fill="none" stroke="#0E110F" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="22" stroke-width="6"/>
    <circle cx="74" cy="0" r="22" stroke-width="6"/>
    <path d="M0,0 L34,-2 L60,-36 L74,0 M34,-2 L24,-38 L0,0 M20,-40 L32,-40 M58,-36 L56,-46 L64,-48" stroke-width="5"/>
    <path d="M26,-46 L50,-70 M50,-70 L64,-48 M26,-46 L44,-26 L36,2 M26,-46 L38,-30" stroke-width="9"/>
    <circle cx="58" cy="-82" r="10" fill="#0E110F" stroke="none"/>
    <path d="M50,-88 L70,-84" stroke-width="4"/>
  </g>
  <!-- chevron de marca -->
  <path d="M80,930 L120,955 L160,930 L160,944 L120,969 L80,944 Z" fill="#FF5A1F"/>
